<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karakurenai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Yuji+Syuku&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css">
    <link rel="stylesheet" href="/public/css/styles.css">
    <script type="module" src="public/js/main.js"></script>
</head>
<body>
    <main class="sceneStage">
        <h1 class="visuallyHidden">Karakurenai: a karuta study</h1>
        <canvas class="sceneCanvas" role="img" aria-label="Anime-style animated scene: a competitive karuta match on tatami mats in warm afternoon light. The reader, kneeling beside the board in an orange jacket, draws breath. A player's eyes open. The first syllable, chi, sounds, and the player's hand sweeps the card karakurenai ni into the air. It falls onto the Tatsuta River in autumn, where maple leaves drift and the water around the card turns crimson."></canvas>
        <p class="syllableCue" lang="ja" aria-hidden="true">ち</p>
        <figure class="poemCard">
            <blockquote class="poemText" lang="ja">
                <p>ちはやぶる<br>神代も聞かず<br>竜田川<br>からくれなゐに<br>水くくるとは</p>
            </blockquote>
            <figcaption class="poemCaption">
                <p class="poemRomaji" lang="ja-Latn">Chihayaburu / kamiyo mo kikazu / Tatsutagawa / karakurenai ni / mizu kukuru to wa</p>
                <p class="poemTranslation">Not even in the age of the mighty gods was such a thing heard of: the Tatsuta River, its waters tie-dyed in crimson.</p>
                <p class="poemAuthor">Ariwara no Narihira, Hyakunin Isshu No. 17</p>
            </figcaption>
        </figure>
        <p class="sceneError" role="alert" hidden></p>
        <div class="sceneControls">
            <button class="controlButton soundToggle" type="button" aria-pressed="false">
                Sound<span class="soundToggleState" aria-hidden="true">off</span>
            </button>
            <button class="controlButton motionToggle" type="button">
                <span class="motionToggleLabel">Pause</span><span class="visuallyHidden"> animation</span>
            </button>
        </div>
    </main>
    <footer class="siteFooter">
        <p class="siteCredit">Inspired by Madhouse's <cite>Chihayafuru</cite> · Poem: Ariwara no Narihira, Hyakunin Isshu No. 17</p>
    </footer>
</body>
</html>
